<div class="layout">
  <section class="editor-pane">
    <header>
      <h1>{{ hasGraphs ? graphs[index].topic : 'Graph JSON' }}</h1>
      <span *ngIf="hasGraphs" class="status" [class.bad]="jsonError" [class.good]="!jsonError">
        {{ jsonError ? 'Invalid' : 'Valid' }}
      </span>
    </header>

    <textarea
      [value]="text"
      (input)="onInput($event)"
      [class.invalid]="jsonError"
      [disabled]="!hasGraphs"
      spellcheck="false"
      aria-label="Graph JSON"
    ></textarea>

    <nav class="pager" aria-label="Graph navigation">
      <button type="button" (click)="backward()" [disabled]="!canGoBackward">&#8249; Backward</button>
      <span class="position">{{ hasGraphs ? index + 1 : 0 }} / {{ graphs.length }}</span>
      <button type="button" (click)="forward()" [disabled]="!canGoForward">Forward &#8250;</button>
    </nav>

    <div class="error" *ngIf="!hasGraphs" role="alert">No graphs loaded.</div>

    <div class="error" *ngIf="hasGraphs && jsonError" role="alert">
      {{ jsonError }}
      <div class="hint">The graph still shows the last valid input.</div>
    </div>

    <div class="error" *ngIf="hasGraphs && !jsonError && expressionErrors.length" role="alert">
      <div *ngFor="let e of expressionErrors"><strong>{{ e.id }}</strong>: {{ e.message }}</div>
    </div>
  </section>

  <section class="graph-pane">
    <app-desmos-graph [spec]="spec" (expressionErrors)="onExpressionErrors($event)"></app-desmos-graph>
  </section>
</div>
